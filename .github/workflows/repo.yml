name: repo

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Validate compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml config --quiet

  roadmap:
    name: Roadmap TODOs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report remaining TODOs per step
        run: |
          {
            echo "## Remaining TODOs"
            echo ""
            echo "| Step | Count |"
            echo "|---|---|"
            for n in $(seq 0 12); do
              c=$(grep -rnF --exclude-dir=.git --exclude='*.md' "TODO(step-$n)" . | wc -l)
              if [ "$c" -gt 0 ]; then
                echo "| $n | $c |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"